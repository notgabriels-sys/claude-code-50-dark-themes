<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Theme Setup Assistant</title>
  <!-- ground: shop terminal surface, same black as the favicon tile -->
  <rect width="512" height="512" fill="#0a0a0b"/>
  <!-- prompt chevron: shop ink, 64-unit round stroke (12.5% of the canvas, the favicon's 8-on-64) -->
  <path d="M138 176 L196 256 L138 336" fill="none" stroke="#e9eaec" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- block cursor = paint-chip swatch, three Vol. 3 accents separated by 12-unit ground seams -->
  <!-- top: Sidechain accent -->
  <path d="M256 144 A16 16 0 0 1 272 128 H368 A16 16 0 0 1 384 144 V205.33 H256 Z" fill="#52D2E0"/>
  <!-- middle: Strobe second (the shop favicon's violet) -->
  <path d="M256 217.33 H384 V294.67 H256 Z" fill="#A48ED7"/>
  <!-- bottom: Sodium accent -->
  <path d="M256 306.67 H384 V368 A16 16 0 0 1 368 384 H272 A16 16 0 0 1 256 368 Z" fill="#F7A63B"/>
</svg>
