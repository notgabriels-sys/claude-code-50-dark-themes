<!doctype html>
<!--
  Deep Field signature for Apple Mail.

  To install: open this file in a browser, select all (Cmd+A), copy (Cmd+C),
  then paste into Mail > Settings > Signatures. Mail keeps pasted rich text
  along with its inline styles. This comment is not part of the rendered page,
  so it will not come along.

  Fill in the four ALL-CAPS placeholders below before you paste.

  Why there is no text colour here: no single colour clears the 4.5:1
  body-text floor against both a white and a dark recipient background, so the
  words inherit the reading client's own foreground and stay legible for
  everyone. The accent appears only on the rule, which carries no text.

  To run a different palette, replace #7A8CFF with that theme's `claude` value.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deep Field mail signature</title>
</head>
<body style="margin:0;padding:24px;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
  <tr>
    <td style="border-top:2px solid #7A8CFF;padding-top:10px;font-family:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.55;">
      <strong>YOUR NAME</strong><br>
      YOUR ROLE<br>
      <span style="font-size:12px;">YOUR&nbsp;CITY</span><br>
      <a href="https://YOUR-SITE" style="font-size:12px;">YOUR-SITE</a>
    </td>
  </tr>
</table>

</body>
</html>
