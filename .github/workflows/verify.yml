name: Verify themes and shop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the verifier holds each dated page's dateModified to its git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Each failing test, and the verifier's message, also becomes an annotation on the check
      # run (scripts/github-annotations.mjs), which the checks API returns where logs are not read.
      - name: Tests
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/github-annotations.mjs --test-reporter-destination=stdout
          scripts/*.test.mjs
      - name: Verifier
        shell: bash
        run: |
          set +e
          node scripts/verify.mjs 2> "$RUNNER_TEMP/verify-stderr.txt"
          status=$?
          cat "$RUNNER_TEMP/verify-stderr.txt" >&2
          if [ "$status" -ne 0 ]; then
            node scripts/github-annotations.mjs "verify failed" < "$RUNNER_TEMP/verify-stderr.txt"
          fi
          exit "$status"
      # The READMEs' theme-page links, rendered by GitHub itself at this commit
      # (scripts/check-readme-render.mjs): the ground truth behind verify's offline reader.
      - name: README render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-readme-render.mjs "$GITHUB_SHA"
