name: Verify themes and shop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify.mjs

      - name: Test the checkout service
        working-directory: checkout
        run: |
          npm ci
          npm test
