name: Audio Preflight feedback
description: Suggest a missing check, report unclear wording, or share a delivery workflow edge case.
title: "[Audio Preflight feedback]: "
labels:
  - audio-preflight
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Audio Delivery Preflight CLI more useful and less hand-wavy.

        Please do not upload private client audio, unreleased masters, passwords, license keys or financial/order data.
  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      options:
        - Missing delivery check
        - False positive / unclear warning
        - Documentation or wording correction
        - Platform / workflow compatibility note
        - Community / launch safety concern
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow context
      description: What kind of delivery folder or handoff is this about?
      placeholder: "Example: 8 WAV masters + artwork + credits document for a Bandcamp/label handoff."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the tool catch or explain better?
      description: Describe the check, warning, wording or edge case.
    validations:
      required: true
  - type: textarea
    id: safe_example
    attributes:
      label: Safe example
      description: Optional. Paste anonymized filenames, folder structure or report lines only. No private audio or client data.
      placeholder: |
        Delivery/
          Artist_Title_master_v03.wav
          Artist_Title_instrumental_v03.wav
          credits.md
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included private client audio, unreleased masters, secrets, order data or personal financial data.
          required: true
